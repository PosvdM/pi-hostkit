name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.containment && format(', {0}', matrix.containment) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # Second Linux run without the cgroup scope, to cover the snapshot fallback.
          - os: ubuntu-latest
            containment: snapshot
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HOSTKIT_TEST_CONTAINMENT: ${{ matrix.containment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install pi 1.5.0
        run: npm install -g @earendil-works/pi-coding-agent@1.5.0
      - name: Start a user systemd instance (Linux cgroup v2 scopes)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for i in $(seq 1 50); do
            [ -S "/run/user/$uid/bus" ] && break
            sleep 0.2
          done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          if [ -z "${{ matrix.containment }}" ]; then echo "HOSTKIT_TEST_REQUIRE_CGROUP=1" >> "$GITHUB_ENV"; fi
      - run: npm test

  prebuild:
    name: prebuild (${{ matrix.os }}${{ matrix.arch && format(', {0}', matrix.arch) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: macos-latest
            arch: x64
          - os: windows-latest
          - os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx prebuildify --napi --strip ${{ matrix.arch && format('--arch {0}', matrix.arch) || '' }}
      - name: Load the prebuilt module
        if: matrix.arch == ''
        run: node -e "const m = require('node-gyp-build')(process.cwd()); if (typeof m.fsInfo !== 'function') process.exit(1); console.log(m.fsInfo('.'))"
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.os }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: prebuilds/
          if-no-files-found: error

  prebuilds:
    name: collect prebuilds
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true
      - run: find prebuilds -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds
          path: prebuilds/
