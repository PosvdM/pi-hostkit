name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.containment }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        containment: [auto]
        include:
          # Linux 的第二轮覆盖快照退路，不使用 cgroup scope。
          - os: ubuntu-latest
            containment: snapshot
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HOSTKIT_TEST_CONTAINMENT: ${{ matrix.containment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install pi 1.5.0
        run: npm install -g @earendil-works/pi-coding-agent@1.5.0
      - name: Start a user systemd instance (Linux cgroup v2 scopes)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for i in $(seq 1 50); do
            [ -S "/run/user/$uid/bus" ] && break
            sleep 0.2
          done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          if [ "${{ matrix.containment }}" = auto ]; then echo "HOSTKIT_TEST_REQUIRE_CGROUP=1" >> "$GITHUB_ENV"; fi
      - name: 创建大小写敏感 APFS 磁盘映像
        if: runner.os == 'macOS'
        run: |
          hdiutil create -size 128m -fs APFSX -volname HostkitCase "$RUNNER_TEMP/hostkit-case.dmg"
          mkdir -p "$RUNNER_TEMP/hostkit-case"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/hostkit-case" "$RUNNER_TEMP/hostkit-case.dmg"
          echo "HOSTKIT_TEST_APFS=$RUNNER_TEMP/hostkit-case" >> "$GITHUB_ENV"
      - name: 创建真实 SSHFS 远程挂载
        if: runner.os == 'Linux' && matrix.containment == 'auto'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshfs openssh-server
          mkdir -p "$RUNNER_TEMP/hostkit-remote-source" "$RUNNER_TEMP/hostkit-remote"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/hostkit-ssh-key"
          cp "$RUNNER_TEMP/hostkit-ssh-key.pub" "$RUNNER_TEMP/hostkit-authorized-keys"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222 -o "AuthorizedKeysFile=$RUNNER_TEMP/hostkit-authorized-keys" -o PasswordAuthentication=no -o StrictModes=no -o "PidFile=$RUNNER_TEMP/hostkit-sshd.pid"
          sshfs -p 2222 -o "IdentityFile=$RUNNER_TEMP/hostkit-ssh-key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$USER@127.0.0.1:$RUNNER_TEMP/hostkit-remote-source" "$RUNNER_TEMP/hostkit-remote"
          echo "HOSTKIT_TEST_REMOTE=$RUNNER_TEMP/hostkit-remote" >> "$GITHUB_ENV"
      - run: npm test
      - name: 卸载平台测试卷
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ] && mount | grep -q "$RUNNER_TEMP/hostkit-case"; then
            hdiutil detach "$RUNNER_TEMP/hostkit-case"
          fi
          if [ "$RUNNER_OS" = Linux ] && mountpoint -q "$RUNNER_TEMP/hostkit-remote"; then
            fusermount -u "$RUNNER_TEMP/hostkit-remote"
          fi
          if [ -f "$RUNNER_TEMP/hostkit-sshd.pid" ]; then sudo kill "$(sudo cat "$RUNNER_TEMP/hostkit-sshd.pid")"; fi

  prebuild:
    name: prebuild (${{ matrix.os }}${{ matrix.arch && format(', {0}', matrix.arch) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: macos-latest
            arch: x64
          - os: windows-latest
          - os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx prebuildify --napi --strip ${{ matrix.arch && format('--arch {0}', matrix.arch) || '' }}
      - name: Load the prebuilt module
        if: matrix.arch == ''
        run: node -e "const m = require('node-gyp-build')(process.cwd()); if (typeof m.fsInfo !== 'function') process.exit(1); console.log(m.fsInfo('.'))"
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.os }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: prebuilds/
          if-no-files-found: error

  prebuilds:
    name: collect prebuilds
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true
      - run: find prebuilds -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds
          path: prebuilds/
